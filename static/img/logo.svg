<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer dashed ring -->
  <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="0.6" stroke-opacity="0.35" stroke-dasharray="2 4"/>
  <!-- Hexagram — triangle pointing up -->
  <polygon points="16,3.5 26.8,22.3 5.2,22.3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
  <!-- Hexagram — triangle pointing down -->
  <polygon points="16,28.5 26.8,9.7 5.2,9.7" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"/>
  <!-- Six point nodes -->
  <circle cx="16"   cy="3.5"  r="1.1" fill="currentColor" opacity="0.75"/>
  <circle cx="26.8" cy="9.7"  r="1.1" fill="currentColor" opacity="0.75"/>
  <circle cx="26.8" cy="22.3" r="1.1" fill="currentColor" opacity="0.75"/>
  <circle cx="16"   cy="28.5" r="1.1" fill="currentColor" opacity="0.75"/>
  <circle cx="5.2"  cy="22.3" r="1.1" fill="currentColor" opacity="0.75"/>
  <circle cx="5.2"  cy="9.7"  r="1.1" fill="currentColor" opacity="0.75"/>
  <!-- Center -->
  <circle cx="16" cy="16" r="1.6" fill="currentColor"/>
</svg>
